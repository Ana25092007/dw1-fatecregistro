<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>

    <h1>Formulários no HTML5</h1>
    <form method="GET">

      <label for="nome">Nome:</label><br />
      <!-- Input texto-->
      <input name="nome"  type="text" id="nome"  placeholder="Insira seu nome completo!"/><br />

      <label for="email">E-mail:</label><br />
      <!-- Input de email-->
      <input name="email" type="email" id="email" placeholder="Insira seu e-mail!" /><br />

      <label for="senha">Senha:</label><br />
      <!-- Input de senha-->
      <input name="senha" type="password" id="senha" placeholder="Insira sua senha!" /><br />
      <br><br>
      <!--BOTÃO DE SUBMETER O FORMULÁRIO-->
      <input type="submit" value="cadastrar">
      <!--BOTÃO DE LIMPAR O FORMULÁRIO-->
      <input type="reset" value="Limpar">
    </form>
    <br /><br />
    <hr />

    <h4> Outros Inputs:</h4>
    <form>
        <label>Quantidade:</label><br>
        <!--Input de números-->
        <input type="number" min="0" max="10"/> <br>
        <label>Data:</label><br>
        <!--Imput de números-->
        <input type="date"/> <br /> <br />
        <!--Input de arquivos-->
        <input type="file" /> <br /> <br />
        <!--Campo se texto longo(textarea)-->
        <label>Comentários:</label>
        <textarea rows="4" cols="40"></textarea>
        <!--Campo de seleção-->
        <label>cursos:</label>
        <select name="cursos">
            <option value="1">Programação</option>
            <option value="2"></option>
            <option value="3"></option>
            <option value="4"></option>
        </select>
    </form>
    <br><br>
    <hr>
    <h2>Exemplo de formulário completo:</h2>
    <!-- FORMULÁRIO COMPLETO-->
     <form action="#" method="POST">
        <fieldset>
            <legend>Dados Pessoais:</legend>
            <label for="name">Nome:</label>
            <input type="text" placeholder="Insira seu nome!" id="name" name="name">
            <br>
            <label for="nascimento"> Data de nascimento:</label>
            <input type="date">
            <label for="sexo">Sexo:</label>
            <!-- Radio Buttons-->
             <input type="radio" name="sexo">Masculino
             <input type="radio" name="sexo">Feminino
             <input type="radio" name="sexo"> Prefiro não informar
        </fieldset>
        <fieldset>
        <legend>Dados de endereço:</legend>
        </fieldset>
     </form>
  </body>
</html>
